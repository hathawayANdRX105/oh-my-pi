# 全仓统一 ruff 基准。
# canon `code_python` 清单跑 `ruff check --no-cache --exclude .githooks` 时自动发现本文件。
# 目的: 把 ruff 0.16 无 config 时默认套用的巨宽规则集收敛到一套可控、可清理的基线,
# 避免全仓 2000+ 存量 finding 长期挡 pre-push。
# 子包若有自己的 [tool.ruff] 就近覆盖 —— robomp 那份已对齐到 line 120 / py311。

line-length = 120
target-version = "py311"

# 全仓门现已激活: 脚手架/研究/eval 的存量 ruff 债已分批清完(#16–#21), 不再需要
# extend-exclude。若未来再新增脚手架, 按目录分批清理, 且用 extend-exclude
# (与 canon CLI 的 --exclude .githooks 叠加)而非顶层 exclude(顶层会被 CLI --exclude 覆盖)。
# 仅存 per-file-ignores: 对一次性研究/eval 脚本豁免若干风格规则, 真·bug 规则(F)仍生效。

[lint]
# 收敛的基线: PEP8 + pyflakes(未用/未定义) + import 排序 + pyupgrade + bugbear + 简化。
# 有意不开 ALL: 全规则套在研究/eval/脚本脚手架上会产生数百条与 shipped 无关的噪音。
select = [
    "E",    # pycodestyle (error)
    "W",    # pycodestyle (warning)
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[lint.pyupgrade]
keep-runtime-typing = true

# 非 shipped 分析/评测脚手架: 长 prompt / URL / 命令行字符串换行会改文本或命令本身,
# 不强制 line-length。edit_benchmark_common 的 E402 是 import 必须排在 sys.path.insert
# 之后(有意)。
[lint.per-file-ignores]
"scripts/rate-edit-tool.py" = ["E501"]
"scripts/edit_benchmark_common.py" = ["E501", "E402"]
"crates/pi-natives/tools/gen-deepseek-fixtures.py" = ["E501"]
"crates/pi-natives/tools/gen-qwen-fixtures.py" = ["E501"]
# 研究/实验脚手架(snapcompact/research): ad-hoc 分析脚本, 长行/循环变量/延迟 import
# 等风格规则不适用, 只保留 F(pyflakes 真·bug)等实质检查; 风格规则按文件豁免。
"packages/snapcompact/research/**/*.py" = ["E501", "E402", "B023", "E741", "B007"]
