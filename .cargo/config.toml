# Cargo environment for the workspace.
#
# Native CMake builds use Ninja: Xcode's GNU make 3.81 can block while reading
# cargo's forwarded jobserver pipe. CI images and the Nix dev shell include
# Ninja; macOS dev hosts need `brew install ninja`.
[env]
CMAKE_GENERATOR = "Ninja"
# Store each crate's metadata only in its .rmeta instead of duplicating it into
# every rlib. Measured on a reqwest-sized graph: 196 MB -> 130 MB target dir at
# identical build times. Requires the pinned nightly (rust-toolchain.toml).
# The accepted spelling is toolchain-coupled: this nightly accepts a bare
# boolean, while older nightlies took `"DoNotEmbed"`.
[unstable]
embed-metadata = false

# ── canon 体系性能配置（rust-dev-perf skill）────────────────────
[build]
# 多会话并发上限：每个 cargo 进程最多 4 个并行编译单元
jobs = 4
# sccache 跨 worktree 编译缓存
# （勿用 [env] RUSTC_WRAPPER：cargo 启动时自读该变量，[env] 够不着）
rustc-wrapper = "sccache"
